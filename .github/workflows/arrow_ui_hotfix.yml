name: Emir Arrow UI Hotfix

on:
  push:
    paths:
      - '.github/workflows/arrow_ui_hotfix.yml'

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Patch app dataframe rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          import_line = 'from ui_dataframe import streamlit_dataframe as safe_dataframe\n'
          if import_line not in text:
              anchor = 'import streamlit as st\n'
              if anchor not in text:
                  raise SystemExit('streamlit import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)
          text = text.replace('st.dataframe(', 'safe_dataframe(')
          path.write_text(text, encoding='utf-8')

          if 'st.dataframe(' in text:
              raise SystemExit('unsafe st.dataframe call remains in app.py')
          if 'safe_dataframe(result["autonomous_evidence"]' not in text:
              raise SystemExit('autonomous evidence rendering was not patched')
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile and regression test
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q app.py ui_dataframe.py
          python -c "import ui_dataframe; print(ui_dataframe.__file__)"
          pytest -q tests/test_ui_dataframe_arrow_safe.py

      - name: Commit runtime patch
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo 'app.py already patched'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app.py
            git commit -m 'Route Streamlit tables through Arrow-safe renderer'
            git push origin HEAD:main
          fi

      - name: Build root-ready ZIP
        shell: bash
        run: |
          rm -f idx_emir_scanner_v1.9.15_hotfix3_arrow_safe_dashboard_root_ready.zip
          zip -qr idx_emir_scanner_v1.9.15_hotfix3_arrow_safe_dashboard_root_ready.zip . \
            -x '.git/*' '.github/workflows/arrow_ui_hotfix.yml' '__pycache__/*' '*/__pycache__/*' '*.pyc' '.pytest_cache/*'
          unzip -t idx_emir_scanner_v1.9.15_hotfix3_arrow_safe_dashboard_root_ready.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: idx-emir-v1-9-15-hotfix3-arrow-safe-dashboard
          path: idx_emir_scanner_v1.9.15_hotfix3_arrow_safe_dashboard_root_ready.zip
          if-no-files-found: error
