name: One-shot Emir v9 runtime hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-emir-v9-runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch v9 readiness and smart-money runtime visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, expected: int, label: str) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrence(s), found {count}')
              text = text.replace(old, new)

          # Root cause: persistence.py emits HEALTHY_EMIR_DATABASE_V9 while app.py still checked V8.
          replace_exact('HEALTHY_EMIR_DATABASE_V8', 'HEALTHY_EMIR_DATABASE_V9', 2, 'healthy-state contract')
          replace_exact('DATABASE_NOT_READY_V7', 'DATABASE_NOT_READY_V9', 1, 'fallback-state contract')
          replace_exact('schema v8 hilang', 'schema v9 hilang', 1, 'transport error copy')
          replace_exact('schema v8 lengkap/berizin', 'schema v9 lengkap/berizin', 1, 'readiness error copy')

          old_import = 'from top3_dashboard import enrich_dashboard_scores, render_top3_dashboard_html, select_top3, select_next_leaders, select_real_money_top3'
          new_import = 'from top3_dashboard import (\n    SMART_MONEY_COST_BASIS_VERSION, enrich_dashboard_scores, render_top3_dashboard_html,\n    select_top3, select_next_leaders, select_real_money_top3,\n)'
          replace_exact(old_import, new_import, 1, 'smart-money version import')

          old_caption = '''st.caption(\n    f"Versi {ENGINE_VERSION} · resumable chunked scan · progressive deep review · "\n    "hasil dan evidence dipindahkan ke Supabase secara terukur"\n)\nrender_methodology()'''
          new_caption = '''st.caption(\n    f"Versi {ENGINE_VERSION} · resumable chunked scan · progressive deep review · "\n    "hasil dan evidence dipindahkan ke Supabase secara terukur"\n)\nst.caption(\n    f"Runtime contract: database schema v9 · Smart Money Cost Basis {SMART_MONEY_COST_BASIS_VERSION} · "\n    "estimated cost selalu diberi label proxy kecuali direct broker evidence terverifikasi."\n)\nrender_methodology()'''
          replace_exact(old_caption, new_caption, 1, 'runtime marker')

          old_chart = '''        ("Entry Low", "entry_low"), ("Entry High", "entry_high"), ("Trigger", "trigger"),\n        ("Stop", "stop_loss"), ("TP1", "tp1"), ("TP2", "tp2"), ("Defended", "defended_level"),'''
          new_chart = '''        ("Entry Low", "entry_low"), ("Entry High", "entry_high"), ("Trigger", "trigger"),\n        ("Stop", "stop_loss"), ("TP1", "tp1"), ("TP2", "tp2"), ("Defended", "defended_level"),\n        ("SM Cost Low", "estimated_smart_money_cost_low"), ("SM Cost", "estimated_smart_money_cost"),\n        ("SM Cost High", "estimated_smart_money_cost_high"),'''
          replace_exact(old_chart, new_chart, 1, 'chart smart-money levels')

          old_radar = '''        "broker_inventory_score", "dashboard_flow_score", "dashboard_silent_accum_score", "smart_money_score", "narrative_score", "story_runway_score",'''
          new_radar = '''        "broker_inventory_score", "estimated_smart_money_cost", "estimated_smart_money_cost_low", "estimated_smart_money_cost_high",\n        "smart_money_cost_distance_pct", "smart_money_cost_state", "smart_money_cost_confidence_pct", "smart_money_cost_evidence_type",\n        "dashboard_flow_score", "dashboard_silent_accum_score", "smart_money_score", "narrative_score", "story_runway_score",'''
          replace_exact(old_radar, new_radar, 1, 'radar smart-money columns')

          old_flow = '''        "ticker", "broker_inventory_score", "broker_inventory_coverage_pct", "broker_inventory_shift_state",\n        "holder_persistence_score", "inventory_dryness_score", "retail_exit_score",'''
          new_flow = '''        "ticker", "broker_inventory_score", "broker_inventory_coverage_pct", "broker_inventory_shift_state",\n        "estimated_smart_money_cost", "estimated_smart_money_cost_low", "estimated_smart_money_cost_high",\n        "smart_money_cost_distance_pct", "smart_money_cost_state", "smart_money_cost_confidence_pct", "smart_money_cost_evidence_type",\n        "holder_persistence_score", "inventory_dryness_score", "retail_exit_score",'''
          replace_exact(old_flow, new_flow, 1, 'flow smart-money columns')

          old_json = '''                "why_now", "what_must_happen_next", "thesis_invalidation", "defended_level",\n                "trigger_provenance", "trim_state", "risk_flags",'''
          new_json = '''                "why_now", "what_must_happen_next", "thesis_invalidation", "defended_level",\n                "estimated_smart_money_cost", "estimated_smart_money_cost_low", "estimated_smart_money_cost_high",\n                "smart_money_cost_distance_pct", "smart_money_cost_state", "smart_money_cost_confidence_pct", "smart_money_cost_evidence_type",\n                "trigger_provenance", "trim_state", "risk_flags",'''
          replace_exact(old_json, new_json, 1, 'chart diagnostics smart-money fields')

          old_top3_caption = '''        "Execution Research Top 3 adalah radar timing/flow untuk riset dan tidak identik dengan kandidat modal riil. Final Score = Emir Conviction Score; "\n        "flow dan silent accumulation tetap diberi label proxy bila direct broker data tidak tersedia."'''
          new_top3_caption = '''        "Execution Research Top 3 adalah radar timing/flow untuk riset dan tidak identik dengan kandidat modal riil. Final Score = Emir Conviction Score; "\n        f"flow/silent accumulation dan Smart Money Cost Basis {SMART_MONEY_COST_BASIS_VERSION} tetap diberi label proxy bila direct broker data tidak tersedia."'''
          replace_exact(old_top3_caption, new_top3_caption, 1, 'top3 runtime caption')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile patched runtime
        run: python -m py_compile app.py top3_dashboard.py top3_dashboard_legacy.py persistence.py scan_jobs.py resumable_scan.py
      - name: Verify required runtime markers
        run: |
          grep -n 'HEALTHY_EMIR_DATABASE_V9' app.py
          grep -n 'Smart Money Cost Basis' app.py
          grep -n 'estimated_smart_money_cost' app.py
          if grep -q 'HEALTHY_EMIR_DATABASE_V8' app.py; then exit 1; fi
      - name: Commit runtime hotfix
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix Emir v9 readiness gate and expose smart-money cost'
          git push origin HEAD:main
