name: Emir v1.9.15 live provider smoke

on:
  push:
    paths:
      - '.github/workflows/live-smoke-v1-9-15.yml'
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live provider smoke
        run: |
          python - <<'PY'
          import json, math, pandas as pd
          from data_providers import fetch_many_ohlcv
          from autonomous_enrichment import fetch_many_fundamentals
          from idx_official_fundamentals import fetch_many_idx_official_fundamentals
          from narrative_flow_engine import calculate_market_features

          tickers = [
              'OMED.JK','ELSA.JK','MARK.JK','SUNI.JK','BKSL.JK','DMAS.JK','SMIL.JK','PBID.JK','TLDN.JK','TSPC.JK',
              'BISI.JK','JRPT.JK','RAJA.JK','ADMR.JK','MDKA.JK','SSIA.JK','TAPG.JK','IMPC.JK','RMKE.JK','MBSS.JK'
          ]
          frames, audit = fetch_many_ohlcv(['^JKSE', *tickers], period='3y', max_workers=4, completed_only=True, serial_recovery_limit=8)
          benchmark = frames.get('^JKSE', pd.DataFrame())
          feature_rows = []
          for t in tickers:
              f = frames.get(t, pd.DataFrame())
              if f.empty:
                  continue
              feat = calculate_market_features(f, benchmark, as_of=pd.Timestamp.now(tz='Asia/Jakarta'))
              feature_rows.append({'ticker':t, **feat})
          fundamentals, faudit = fetch_many_fundamentals(tickers[:10], max_workers=3)
          official, oaudit = fetch_many_idx_official_fundamentals(tickers[:3], now=pd.Timestamp.now(tz='Asia/Jakarta'), max_workers=2)
          out = {
              'ohlcv_requested': len(tickers)+1,
              'ohlcv_ready': len(frames),
              'ticker_ohlcv_ready': sum(t in frames for t in tickers),
              'benchmark_ready': not benchmark.empty,
              'feature_rows': len(feature_rows),
              'fundamental_rows': len(fundamentals),
              'fundamental_audit_status': faudit.get('status', pd.Series(dtype=str)).value_counts().to_dict() if not faudit.empty else {},
              'official_rows': len(official),
              'official_audit_status': oaudit.get('status', pd.Series(dtype=str)).value_counts().to_dict() if not oaudit.empty else {},
              'ohlcv_provider_status': audit.get('status', pd.Series(dtype=str)).value_counts().to_dict() if not audit.empty else {},
              'sample_features': feature_rows[:3],
          }
          print('LIVE_SMOKE_JSON=' + json.dumps(out, default=str))
          if out['ticker_ohlcv_ready'] < 16:
              raise SystemExit('OHLCV live coverage below 80%')
          if out['feature_rows'] < 16:
              raise SystemExit('Feature computation coverage below 80%')
          PY
