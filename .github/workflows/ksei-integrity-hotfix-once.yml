name: KSEI integrity hotfix once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ksei-integrity-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply integrity patch
        run: python tools/apply_ksei_integrity_hotfix.py
      - name: Compile patched module
        run: python -m py_compile autonomous_enrichment.py
      - name: Commit patched parser
        run: |
          if git diff --quiet -- autonomous_enrichment.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autonomous_enrichment.py
          git commit -m "Harden KSEI placeholder profile validation"
          git push origin HEAD:main
