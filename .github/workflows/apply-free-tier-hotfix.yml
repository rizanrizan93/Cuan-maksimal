name: Apply Emir free-tier hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-free-tier-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[free-tier-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch outage diagnosis and compact resumable checkpoints
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('persistence.py')
          text = p.read_text()
          if 'def _database_failure_state(' not in text:
              anchor = '\n\ndef test_connection(config: DatabaseConfig) -> pd.DataFrame:\n'
              helper = '''\n\ndef _database_failure_state(exc: Exception) -> str:\n    """Classify preflight failures without confusing an outage with a missing schema."""\n    detail = f"{type(exc).__name__}: {exc}".lower()\n    transport_tokens = (\n        "econnrefused", "connection refused", "connection reset", "connection aborted",\n        "timed out", "timeout", "readtimeout", "connecttimeout", "max retries",\n        "502", "503", "504", "service unavailable", "upstream connect",\n        "database system is not accepting connections", "no space left on device",\n        "network is unreachable",\n    )\n    if any(token in detail for token in transport_tokens):\n        return "DATABASE_UNREACHABLE"\n    permission_tokens = ("401", "403", "permission denied", "insufficient privilege", "jwt", "apikey")\n    if any(token in detail for token in permission_tokens):\n        return "DATABASE_PERMISSION_REQUIRED"\n    return "MIGRATION_OR_SCHEMA_REQUIRED"\n'''
              if anchor not in text:
                  raise SystemExit('persistence.py test_connection anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(
              'rows.append({**base, "state": "MIGRATION_OR_PERMISSION_REQUIRED", "table": table, "detail": str(exc)})',
              'rows.append({**base, "state": _database_failure_state(exc), "table": table, "detail": str(exc)})'
          )
          old = '''    healthy = all(row["state"] == "READY" for row in rows)\n    rows.insert(\n        0,\n        {\n            **base,\n            "state": "HEALTHY_EMIR_DATABASE_V8" if healthy else "DATABASE_NOT_READY_V8",\n            "table": "__SUMMARY__",\n            "detail": f"{sum(row['state'] == 'READY' for row in rows)}/{len(checks)} tables readable.",\n        },\n    )'''
          new = '''    healthy = all(row["state"] == "READY" for row in rows)\n    unreachable = sum(row["state"] == "DATABASE_UNREACHABLE" for row in rows)\n    ready_count = sum(row["state"] == "READY" for row in rows)\n    if healthy:\n        summary_state = "HEALTHY_EMIR_DATABASE_V8"\n        summary_detail = f"{ready_count}/{len(checks)} tables readable."\n    elif unreachable >= max(1, len(checks) - 1):\n        summary_state = "DATABASE_UNREACHABLE_OR_RESOURCE_EXHAUSTED"\n        summary_detail = (\n            f"Database transport failed for {unreachable}/{len(checks)} checks. "\n            "Do not rerun migrations until the database itself accepts connections."\n        )\n    else:\n        summary_state = "DATABASE_NOT_READY_V8"\n        summary_detail = f"{ready_count}/{len(checks)} tables readable; inspect table-level states before migration."\n    rows.insert(\n        0,\n        {\n            **base,\n            "state": summary_state,\n            "table": "__SUMMARY__",\n            "detail": summary_detail,\n        },\n    )'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('app.py')
          text = p.read_text()
          old = '''if not job_tables_ready:\n    st.error(\n        "Resumable scan memerlukan database schema v8 (`cak_scan_jobs`, `cak_scan_job_chunks`, dan `cak_research_memory`). "\n        "Jalankan migration_v8.sql, verify_v8.sql, lalu reboot."\n    )\n    st.dataframe(preflight, width="stretch", hide_index=True)\n    st.stop()'''
          new = '''if not job_tables_ready:\n    if preflight_state == "DATABASE_UNREACHABLE_OR_RESOURCE_EXHAUSTED":\n        st.error(\n            "Database Supabase sedang tidak menerima koneksi / resource exhausted. "\n            "Ini BUKAN bukti schema v8 hilang. Pulihkan health database terlebih dahulu; "\n            "jangan menjalankan migration ulang selama database belum menerima koneksi."\n        )\n    else:\n        st.error(\n            "Resumable scan belum melihat schema v8 lengkap/berizin (`cak_scan_jobs`, `cak_scan_job_chunks`, dan `cak_research_memory`). "\n            "Periksa detail preflight; lakukan migration/permission repair hanya bila table memang missing atau permission gagal."\n        )\n    st.dataframe(preflight, width="stretch", hide_index=True)\n    st.stop()'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('resumable_scan.py')
          text = p.read_text()
          if 'from free_tier_storage import prune_scan_history_best_effort' not in text:
              text = text.replace(
                  'from future_fundamental import calculate_future_fundamental, future_fundamental_evidence_frame\n',
                  'from future_fundamental import calculate_future_fundamental, future_fundamental_evidence_frame\nfrom free_tier_storage import prune_scan_history_best_effort\n', 1)
          if 'def _checkpoint_audit_records(' not in text:
              anchor = 'def _truthy(value: Any) -> bool:\n'
              helper = '''def _checkpoint_audit_records(frame: pd.DataFrame | None, limit: int = 25) -> list[dict[str, Any]]:\n    """Persist a compact checkpoint audit instead of entire wide provider payloads."""\n    if not isinstance(frame, pd.DataFrame) or frame.empty:\n        return []\n    columns = [column for column in (\n        "ticker", "provider", "status", "audit_family", "bars", "last_date", "detail", "error"\n    ) if column in frame.columns]\n    local = frame[columns].head(max(1, int(limit))).copy() if columns else frame.head(max(1, int(limit))).copy()\n    for column in ("detail", "error"):\n        if column in local.columns:\n            local[column] = local[column].astype(str).str.slice(0, 500)\n    return _records(local)\n\n\n'''
              if anchor not in text:
                  raise SystemExit('resumable_scan.py helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('"audit_records": _records(audit),', '"audit_records": _checkpoint_audit_records(audit),')
          text = text.replace('"audit_records": [*_records(load_audit), *_records(benchmark_audit)],', '"audit_records": [*_checkpoint_audit_records(load_audit), *_checkpoint_audit_records(benchmark_audit)],')
          if 'free_tier_storage_housekeeping' not in text:
              marker = '    result = {\n        "radar": radar,'
              insert = '''    storage_housekeeping = prune_scan_history_best_effort(\n        config, keep_scan_runs=2, keep_terminal_jobs=2, exclude_scan_id=scan_id\n    )\n'''
              if marker not in text:
                  raise SystemExit('resumable_scan.py result marker not found')
              text = text.replace(marker, insert + marker, 1)
              text = text.replace('        "job_status": terminal_status,\n', '        "job_status": terminal_status,\n        "free_tier_storage_housekeeping": storage_housekeeping,\n', 1)
          p.write_text(text)
      - name: Validate compile
        run: python -m compileall -q app.py persistence.py resumable_scan.py scan_jobs.py research_memory.py free_tier_storage.py
      - name: Commit hotfix
        run: |
          git config user.name "openai-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app.py persistence.py resumable_scan.py
          if git diff --cached --quiet; then
            echo "No patch changes required"
          else
            git commit -m "Apply free-tier runtime safety [free-tier-applied]"
            git push origin HEAD:main
          fi
