name: Emir persistent evidence hotfix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persistent-evidence-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest
      - name: Apply persistent evidence patch
        run: python tools/apply_persistent_evidence_hotfix.py
      - name: Compile and regression
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile persistent_direct_evidence.py resumable_scan.py
          python -m pytest -q tests/test_persistent_direct_evidence.py tests/test_v1917_data_integrity.py tests/test_v1916_storage_outcome_hardening.py
      - name: Commit production patch
        run: |
          if git diff --quiet -- resumable_scan.py; then
            echo 'No production patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resumable_scan.py
          git commit -m 'Reuse verified direct evidence across Emir scans'
          git push origin HEAD:main
